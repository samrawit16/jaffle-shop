version: 2

models:
  - name: fct_daily_store_health
    description: "Daily revenue, refunds and order volume by order status. The reconciliation grain."
    columns:
      - name: order_date
        tests: [not_null]
      - name: status
        tests: [not_null]
  - name: agg_refund_exposure
    description: "Total refunded money grouped by order status and payment method."
