name: dbt CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Install dependencies
        run: dbt deps

      - name: Create mock profile (no credentials in CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<PROFILE
          jaffle_shop_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: ci-placeholder
                dataset: ci
                threads: 1
                location: US
          PROFILE

      - name: Parse (validates project, Jinja, YAML and sources)
        run: dbt parse --profiles-dir ~/.dbt

      - name: Lint YAML contract
        run: dbt parse --profiles-dir ~/.dbt && echo "project parses cleanly"
